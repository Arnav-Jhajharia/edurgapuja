# Railway builds from this directory (set the service root to `backend/`).
[build]
builder = "NIXPACKS"

[deploy]
# Migrations run on every deploy, before the first request is served. They are
# additive and idempotent, so a redeploy that changes nothing does nothing.
startCommand = "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60 --access-logfile -"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
